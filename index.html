<style>
:root{--bg:#F3F4F1;--surface:#fff;--ink:#16202A;--muted:#5B6673;--line:#D7DBD6;--accent:#D9263F}
@media (prefers-color-scheme:dark){:root{--bg:#121820;--surface:#1B232D;--ink:#E8ECEF;--muted:#9AA5B1;--line:#2B3541;--accent:#F0526B}}
html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 28px;width:min(100%,380px);box-shadow:0 8px 24px rgba(20,30,40,.08);text-align:center}

input:focus{outline:2px solid var(--accent);border-color:transparent}
button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font:500 15px "Noto Sans TC",system-ui;cursor:pointer}
label{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)}
.err{color:var(--accent);font-size:13px;min-height:18px;margin-top:10px}
</style></head><body>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function tryPw(pw,remember){
  try{await open(pw);if(remember){try{localStorage.setItem('trip-pw',pw)}catch(e){}}}
  catch(e){document.getElementById('err').textContent='密碼不對，再試一次。';document.getElementById('pw').value='';document.getElementById('pw').focus();try{localStorage.removeItem('trip-pw')}catch(x){}}
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();tryPw(document.getElementById('pw').value.trim(),document.getElementById('rm').checked)});
try{const saved=localStorage.getItem('trip-pw');if(saved)tryPw(saved,true)}catch(e){}
