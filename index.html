<style>
:root{--bg:#F3F4F1;--surface:#fff;--ink:#16202A;--muted:#5B6673;--line:#D7DBD6;--accent:#D9263F}
@media (prefers-color-scheme:dark){:root{--bg:#121820;--surface:#1B232D;--ink:#E8ECEF;--muted:#9AA5B1;--line:#2B3541;--accent:#F0526B}}
html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 28px;width:min(100%,380px);box-shadow:0 8px 24px rgba(20,30,40,.08);text-align:center}

input:focus{outline:2px solid var(--accent);border-color:transparent}
button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font:500 15px "Noto Sans TC",system-ui;cursor:pointer}
label{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)}
.err{color:var(--accent);font-size:13px;min-height:18px;margin-top:10px}
